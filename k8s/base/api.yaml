apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: items-api            # remplace par les overlays / la CI (kustomize edit set image)
          env:
            - name: DB_HOST
              value: db
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_PASSWORD}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_DB}}
          envFrom:
            - configMapRef: {name: api-config}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - name: http
      port: 80
      targetPort: http
