# Overlay "review" : environnement ephemere par merge request (TPB3).
# La CI fixe le namespace et l'image :  kustomize edit set namespace review-mr-42
#                                         kustomize edit set image items-api=registry.../items-api:abc1234
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: review-placeholder
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: review
    includeSelectors: false
images:
  - name: items-api
    newName: items-api
    newTag: review
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_VERSION=review
      - ENV_NAME=review
