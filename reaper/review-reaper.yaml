# Filet de securite : supprime chaque heure les namespaces de review plus vieux que TTL_HOURS
apiVersion: v1
kind: Namespace
metadata:
  name: review-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: review-reaper
  namespace: review-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: review-reaper
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: review-reaper
subjects:
  - kind: ServiceAccount
    name: review-reaper
    namespace: review-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: review-reaper
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: review-reaper
  namespace: review-system
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: review-reaper
          restartPolicy: Never
          containers:
            - name: reaper
              image: alpine/k8s:1.33.4
              env:
                - name: TTL_HOURS
                  value: "4"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -e
                  now=$(date +%s)
                  kubectl get namespaces -l app.kubernetes.io/part-of=review \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.creationTimestamp}{"\n"}{end}' |
                  while read -r ns created; do
                    age=$(( (now - $(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$created" +%s)) / 3600 ))   # format busybox
                    if [ "$age" -ge "$TTL_HOURS" ]; then
                      echo "suppression de $ns (age ${age}h)"; kubectl delete namespace "$ns" --wait=false
                    else
                      echo "conserve $ns (age ${age}h)"
                    fi
                  done
